_format_version: '1.1'

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes: [{ name: auth-v1-open, strip_path: true, paths: [/auth/v1/verify] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes: [{ name: auth-v1-open-callback, strip_path: true, paths: [/auth/v1/callback] }]
    plugins: [{ name: cors }]
  - name: auth-v1
    url: http://auth:9999/
    routes: [{ name: auth-v1-all, strip_path: true, paths: [/auth/v1/] }]
    plugins: [{ name: cors }, { name: key-auth, config: { hide_credentials: false } }, { name: acl, config: { allow: [anon, admin] } }, { name: rate-limiting, config: { minute: 30, policy: local } }]
  - name: rest-v1
    url: http://rest:3000/
    routes: [{ name: rest-v1-all, strip_path: true, paths: [/rest/v1/] }]
    plugins: [{ name: cors }, { name: key-auth, config: { hide_credentials: true } }, { name: acl, config: { allow: [anon, admin] } }]
  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes: [{ name: realtime-v1-all, strip_path: true, paths: [/realtime/v1/] }]
    plugins: [{ name: cors }, { name: key-auth, config: { hide_credentials: false } }, { name: acl, config: { allow: [anon, admin] } }]
  - name: functions-v1
    url: http://functions:9000/
    routes: [{ name: functions-v1-all, strip_path: true, paths: [/functions/v1/] }]
    plugins: [{ name: cors }]
