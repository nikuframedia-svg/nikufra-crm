name: nikufra-crm

x-outreach-environment: &outreach-environment
  DATABASE_URL: postgresql://outreach_service:${OUTREACH_DATABASE_PASSWORD}@db:5432/postgres
  SUPABASE_URL: http://kong:8000
  SUPABASE_ANON_KEY: ${ANON_KEY}
  OUTREACH_PUBLIC_URL: https://${CRM_DOMAIN}
  OUTREACH_FRONTEND_URL: https://${CRM_DOMAIN}
  OUTREACH_CORS_ORIGINS: https://${CRM_DOMAIN}
  OUTREACH_SEND_ENABLED: ${OUTREACH_SEND_ENABLED:-false}
  OUTREACH_SHADOW_MODE: ${OUTREACH_SHADOW_MODE:-true}
  OUTREACH_ADMIN_ONLY: ${OUTREACH_ADMIN_ONLY:-true}
  OUTREACH_INBOUND_ENABLED: "true"
  OUTREACH_ENCRYPTION_KEYS: ${OUTREACH_ENCRYPTION_KEYS}
  OUTREACH_ACTIVE_KEY_VERSION: ${OUTREACH_ENCRYPTION_CURRENT_VERSION:-1}
  OUTREACH_HMAC_SECRET: ${OUTREACH_STATE_HMAC_SECRET}
  OUTREACH_WEBHOOK_SECRET: ${OUTREACH_WEBHOOK_SECRET}
  OUTREACH_UNSUBSCRIBE_SECRET: ${OUTREACH_UNSUBSCRIBE_SECRET}
  OUTREACH_CANARY_ALLOWLIST: ${OUTREACH_CANARY_ALLOWLIST:-joao@nikufra.ai,joaomilhazes71@gmail.com}
  OUTREACH_ENABLED_PROVIDERS: google
  GOOGLE_CLIENT_ID: ${OUTREACH_GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${OUTREACH_GOOGLE_CLIENT_SECRET}
  GOOGLE_PUBSUB_VERIFICATION_TOKEN: ${OUTREACH_GOOGLE_PUBSUB_VERIFICATION_TOKEN:-}
  OUTREACH_SCHEDULER_INTERVAL_SECONDS: ${OUTREACH_SCHEDULER_INTERVAL_SECONDS:-15}
  OUTREACH_INBOUND_INTERVAL_SECONDS: ${OUTREACH_INBOUND_SYNC_INTERVAL_SECONDS:-60}
  OUTREACH_WORKER_HEALTH_PORT: 8788
  OUTREACH_ENABLE_MICROSOFT: "false"
  OUTREACH_ENABLE_SMTP: "false"

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Vault/pgsodium ciphertext in PGDATA is unusable without this external
      # root key. Bind the single file, never the whole custom-config directory.
      - ${PGSODIUM_ROOT_KEY_FILE}:/etc/postgresql-custom/pgsodium_root.key:ro
      - ./init/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-nikufra-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${CRM_DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${CRM_DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${CRM_DOMAIN},https://${CRM_DOMAIN}/**,http://localhost:1420,http://127.0.0.1:1420
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: https://${CRM_DOMAIN}/auth/v1
      GOTRUE_OAUTH_SERVER_ENABLED: "true"
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: /oauth/consent
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "true"
      GOTRUE_OAUTH_SERVER_DEFAULT_SCOPE: email profile
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      # Browser links remain single-use and expire after 30 minutes.
      GOTRUE_MAILER_OTP_EXP: 1800
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: Nikufra CRM
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: ${AUTH_EMAIL_HOOK_ENABLED:-false}
      # GoTrue permits this loopback-style hostname for HTTP hooks. Docker DNS
      # resolves it directly to Edge Runtime inside the private backend network.
      GOTRUE_HOOK_SEND_EMAIL_URI: ${AUTH_EMAIL_HOOK_URI:-http://host.docker.internal:9000/send-auth-email}
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: ${AUTH_EMAIL_HOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [backend]

  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    command: ["postgrest"]
    networks: [backend]

  realtime:
    # Realtime derives the self-host tenant from this hostname. Keep it aligned
    # with the default tenant seeded as `realtime-dev`.
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H 'Authorization: Bearer ${ANON_KEY}' http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    networks: [backend]

  functions:
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    depends_on:
      kong: { condition: service_healthy }
    volumes:
      - ./volumes/functions:/home/deno/functions:ro
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: https://${CRM_DOMAIN}
      APP_PUBLIC_URL: https://${CRM_DOMAIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      AUTH_EMAIL_HOOK_SECRET: ${AUTH_EMAIL_HOOK_SECRET:-}
    command: ["start", "--main-service", "/home/deno/functions/main"]
    networks:
      backend:
        aliases: [host.docker.internal]

  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    networks: [backend]

  studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on: [meta]
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Nikufra
      DEFAULT_PROJECT_NAME: CRM
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: https://${CRM_DOMAIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
    networks: [backend]

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,rate-limiting
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./volumes/api/kong.yml:/home/kong/kong.template.yml:ro
    entrypoint: ["bash", "-c", "eval \"echo \\\"$(cat /home/kong/kong.template.yml)\\\"\" > /tmp/kong.yml && /entrypoint.sh kong docker-start"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  outreach-api:
    build:
      context: ..
      dockerfile: services/outreach/Dockerfile
    image: nikufra-outreach:${OUTREACH_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      kong: { condition: service_healthy }
    environment:
      <<: *outreach-environment
      OUTREACH_PROCESS: api
      SERVER_PORT: 8787
    expose: ["8787"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  outreach-worker:
    image: nikufra-outreach:${OUTREACH_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
      outreach-api: { condition: service_healthy }
    command: ["node", "dist/worker.js"]
    environment:
      <<: *outreach-environment
      OUTREACH_PROCESS: worker
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    stop_grace_period: 45s
    expose: ["8788"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      kong: { condition: service_healthy }
      outreach-api: { condition: service_healthy }
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/crm:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]

networks:
  backend:

volumes:
  db-data:
  caddy-data:
  caddy-config:
