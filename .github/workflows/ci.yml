name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10.34.5 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Instalar dependências Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Auditar dependências de produção
        run: pnpm security:audit
      - name: Testar frontend
        run: pnpm test
      - name: Compilar frontend
        run: pnpm build
      - name: Testar aplicação desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Validar Edge Functions
        run: find infra/volumes/functions -mindepth 2 -name index.ts -print0 | xargs -0 deno check --no-lock --import-map=infra/volumes/functions/deno.jsonc
      - name: Validar infraestrutura
        run: |
          bash -n infra/*.sh
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml -f infra/docker-compose.production.yml config --quiet

  desktop-platforms:
    name: Compilar segurança nativa (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-14
          - name: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-25
      - name: Compilar aplicação desktop
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
