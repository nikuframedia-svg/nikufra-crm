name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Instalar dependências Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Testar frontend
        run: pnpm test
      - name: Compilar frontend
        run: pnpm build
      - name: Testar aplicação desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Validar Edge Functions
        run: find infra/volumes/functions -mindepth 2 -name index.ts -print0 | xargs -0 deno check --no-lock --import-map=infra/volumes/functions/deno.jsonc
      - name: Validar infraestrutura
        run: |
          bash -n infra/*.sh
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml -f infra/docker-compose.production.yml config --quiet

  desktop-platforms:
    name: Compilar segurança nativa (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-14
          - name: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar aplicação desktop
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
