name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.34.5 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Auditar dependências de produção
        run: pnpm security:audit
      - name: Testar frontend, API e worker Outreach
        run: pnpm test:all
      - name: Compilar frontend, API e worker Outreach
        run: pnpm build:all
      - name: Instalar browser de acessibilidade
        run: pnpm exec playwright install --with-deps chrome
      - name: Validar rotas, responsive e WCAG do Outreach
        run: pnpm test:e2e:outreach
      - name: Validar Edge Functions
        run: |
          (cd infra/volumes/functions && sha256sum --check vendor.sha256)
          find infra/volumes/functions -mindepth 2 -name index.ts -print0 | xargs -0 deno check --frozen=true --config=infra/volumes/functions/deno.typecheck.jsonc
          runtime_cache="$(mktemp -d)"
          DENO_DIR="$runtime_cache" HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 \
            deno eval --no-check --no-lock --config=infra/volumes/functions/deno.jsonc \
            'import { createClient } from "@supabase/supabase-js"; import { Webhook } from "standardwebhooks"; if (typeof createClient !== "function" || typeof Webhook !== "function") throw new Error("bundles locais inválidos");'
      - name: Validar infraestrutura
        run: |
          bash -n infra/*.sh
          bash tests/infra/configure-caddy-outreach.test.sh
          bash tests/infra/outreach-safety-gates.test.sh
          docker compose --env-file infra/.env.example -f infra/docker-compose.yml -f infra/docker-compose.production.yml config --quiet
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testar migrations, RLS, roles e invariantes
        run: ./infra/test-database.sh --bootstrap
      - name: Parar stack de teste
        if: always()
        run: ./infra/local-down.sh || true
