version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types: [minor, patch]
